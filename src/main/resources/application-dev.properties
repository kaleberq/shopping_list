spring.datasource.url=jdbc:postgresql://localhost:5432/shopping_list
spring.datasource.username=shopping_list
spring.datasource.password=shopping_list

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

app.jwt.secret=dev-only-change-in-production-use-at-least-32-chars
app.jwt.expiration-minutes=60

app.verification.code-expiration-minutes=15

# SMTP (Gmail) — credenciais no .env na raiz (ver .env.example)
spring.config.import=optional:file:.env[.properties]

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.verification-subject=Codigo de verificacao - Shopping List

